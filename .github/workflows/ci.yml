name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PNPM_VERSION: '9.12.0'
  NODE_VERSION: '20'

jobs:
  # Runs once; every app-specific job depends on it so we install/cache a single time.
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint (all packages)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (all packages)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/api/.env.example apps/api/.env
      - run: pnpm --filter @sih/shared-types build
      - name: Generate Prisma client (apps/api has no committed dist for it)
        run: pnpm --filter api db:generate
      - run: pnpm typecheck

  # One job per app so a frontend-only PR isn't gated on the AI worker (or vice versa).
  test-and-build:
    name: Test & build (${{ matrix.app }})
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shared-types, web, api, ai-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy .env.example -> .env (dummy dev values only, never committed)
        run: cp apps/${{ matrix.app }}/.env.example apps/${{ matrix.app }}/.env
        if: matrix.app == 'api' || matrix.app == 'ai-worker' || matrix.app == 'web'
      - name: Build shared-types (dependency of every app)
        if: matrix.app != 'shared-types'
        run: pnpm --filter @sih/shared-types build
      - name: Generate Prisma client
        if: matrix.app == 'api'
        run: pnpm --filter api db:generate
      - name: Test
        run: pnpm --filter ${{ matrix.app == 'shared-types' && '@sih/shared-types' || matrix.app }} test
      - name: Build
        run: pnpm --filter ${{ matrix.app == 'shared-types' && '@sih/shared-types' || matrix.app }} build

  contract-check:
    name: API implementation matches contract
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diff apps/api routes against docs/openapi.yaml
        run: pnpm check:contract
